name: Build Android APK (Ohana Charging Play)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: |
        cd android-app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1 || true
        tail -n 100 build_log.txt

    - name: Upload Build Log Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: android-app/build_log.txt

    - name: Check APK and Upload
      uses: actions/upload-artifact@v4
      with:
        name: OhanaChargingPlay-Android-v1.0
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
      if: success()
