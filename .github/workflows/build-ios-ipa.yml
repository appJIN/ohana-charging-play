name: Build iOS IPA (Ohana Charging Play)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Application for Device
      run: |
        xcodebuild -project OhanaChargingPlay.xcodeproj \
          -scheme OhanaChargingPlay \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath derived_data \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Package into IPA
      run: |
        APP_PATH=$(find derived_data -name "OhanaChargingPlay.app" -type d | head -n 1)
        echo "Found App at $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -qr OhanaChargingPlay.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OhanaChargingPlay-iOS-v1.0.ipa
        path: OhanaChargingPlay.ipa
