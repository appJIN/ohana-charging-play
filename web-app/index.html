<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OCP">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ohana Charging Play (OCP)</title>
    <link rel="manifest" href="manifest.json?v=2.0.1">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css?v=2.0.1">
</head>
<body>
    <div class="ocp-container">
        <!-- Top Header -->
        <header class="ocp-header">
            <div class="brand">
                <span class="brand-title">OHANA CHARGING PLAY</span>
                <span class="brand-subtitle">OCP v2.0 • ALWAYS-ON CHARGING</span>
            </div>
            <button id="themeBtn" class="theme-btn" title="Change Color">🎨</button>
        </header>

        <!-- Main Display / Animation -->
        <main class="animation-stage">
            <div class="glow-halo"></div>
            
            <!-- Concentric Animation Rings -->
            <div class="pulse-ring ring-1"></div>
            <div class="pulse-ring ring-2"></div>
            <div class="rotating-ring"></div>

            <!-- Core HUD Display -->
            <div class="hud-center">
                <div class="bolt-icon" id="boltIcon">⚡</div>
                <div class="percent-container">
                    <span id="batteryPercent" class="percent-number">--</span>
                    <span class="percent-sign">%</span>
                </div>
                <div class="status-badge" id="chargingStatus">CHARGING</div>
            </div>
        </main>

        <!-- Bottom Clean Status -->
        <footer class="ocp-footer">
            <div class="screen-awake-tag">
                <span class="green-dot"></span>
                <span>ডিসপ্লে অন • রিয়েল-টাইম সিঙ্ক</span>
            </div>
        </footer>
    </div>

    <!-- Cache Buster ensures Safari never runs old scripts -->
    <script src="app.js?v=2.0.1"></script>
</body>
</html>
